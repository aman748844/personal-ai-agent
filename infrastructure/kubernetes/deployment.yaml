apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent-platform-gateway
  labels:
    app: ai-agent-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-agent-platform
  template:
    metadata:
      labels:
        app: ai-agent-platform
    spec:
      containers:
      - name: gateway
        image: ai-agent-platform-gateway:latest
        ports:
        - containerPort: 4000
        env:
        - name: PORT
          value: "4000"
        - name: AGENT_SECRET
          valueFrom:
            secretKeyRef:
              name: agent-secrets
              key: agent-secret
        resources:
          limits:
            cpu: "1"
            memory: "1Gi"
          requests:
            cpu: "250m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: ai-agent-platform-service
spec:
  type: LoadBalancer
  selector:
    app: ai-agent-platform
  ports:
    - protocol: TCP
      port: 80
      targetPort: 4000
